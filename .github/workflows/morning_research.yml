name: Morning Stock Market Anomaly Detection

# ─── ⏰ いつ実行するか（トリガー） ───
on:
  schedule:
    # 💡 毎日定時に実行（UTC時間で指定するため、日本の朝7時は「前日の夜22時」になります）
    # 分 時 日 月 曜日 (22:00 UTC = 07:00 JST)
    - cron: '0 22 * * *'
  workflow_dispatch: # 💡 GitHubの画面から「手動で今すぐ実行」ボタンも出せるようにする魔法の行

# ─── 💻 何を実行するか（ジョブ） ───
jobs:
  run-analysis:
    runs-on: ubuntu-latest # クラウド上の最新のLinuxを使う

    steps:
    # 1. 変更前: actions/checkout@v4 ➡️ 変更後: @v5 にアップ
    - name: Checkout code
      uses: actions/checkout@v5

    # 2. 変更前: actions/setup-python@v5 ➡️ 変更後: @v6 にアップ
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    # 3. 異常検知に必要なライブラリをインストールする
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance numpy

    # 4. 満を持して、あなたのPythonスクリプトを実行する！
    - name: Run morning check
      env:
        # 💡 安全対策：暗号（Gmailのアプリパスワード）をここに仕込む（ステップ3で設定）
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}     # 💡 金庫から引き出して
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }} # 💡 仮想パソコンに渡す
      run: |
        python morning_check.py